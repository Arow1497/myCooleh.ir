# ================================= GENERAL =====================================

# این تنظیم باعث می‌شود Redis به صورت daemon اجرا شود (در پس زمینه)
daemonize yes

# اگر Redis را به صورت daemon اجرا می‌کنید، مسیر فایل PID را مشخص کنید
pidfile /var/run/redis_6379.pid

# پورت Redis را مشخص کنید
port 6379

# آدرس IP که Redis روی آن گوش می‌دهد را مشخص کنید. برای دسترسی از همه آدرس‌ها 0.0.0.0 را استفاده کنید
bind 0.0.0.0

# فعال کردن حالت protected mode برای امنیت بیشتر (فقط از طریق لوکال‌هاست قابل دسترس باشد).
# اگر نیاز به دسترسی از راه دور دارید، آن را غیرفعال کنید و از bind و تنظیمات امنیتی دیگر استفاده کنید.
protected-mode yes

# تنظیم لاگ‌ها
loglevel notice
logfile "/var/log/redis/redis-server.log"

# ================================= SNAPSHOTTING =================================

# استراتژی‌های ذخیره‌سازی RDB (snapshotting). 
# این تنظیمات به صورت "save <seconds> <changes>" هستند. 
# به عنوان مثال، "save 900 1" به این معنی است که اگر حداقل یک تغییر در 900 ثانیه (15 دقیقه) رخ دهد، Redis دیتابیس را روی دیسک ذخیره می‌کند.
save 900 1
save 300 10
save 60 10000

# نام فایل RDB
dbfilename dump.rdb

# مسیر ذخیره فایل RDB
dir /var/lib/redis

# ================================ APPEND ONLY FILE ===============================

# فعال کردن AOF (Append Only File) برای persistence بهتر
appendonly yes

# نام فایل AOF
appendfilename "appendonly.aof"

# استراتژی همگام‌سازی AOF. 
# "everysec" هر ثانیه تغییرات را روی دیسک می‌نویسد.
# "always" هر دستور را به صورت جداگانه روی دیسک می‌نویسد (امن‌ترین گزینه ولی کندترین).
# "no" به سیستم عامل واگذار می‌کند که چه زمانی تغییرات را روی دیسک بنویسد (سریع‌ترین ولی کمترین امنیت).
appendfsync everysec

# بازنویسی AOF برای کاهش حجم فایل AOF
no-appendfsync-on-rewrite yes 
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# =================================== SECURITY ====================================

# تنظیم پسورد برای Redis (حتماً این پسورد را عوض کنید)
requirepass your_strong_password

# تغییر نام دستورات برای امنیت بیشتر (اختیاری)
# rename-command FLUSHALL "" 

# ==================================== LIMITS =====================================

# حداکثر تعداد کلاینت‌هایی که همزمان می‌توانند به Redis متصل شوند
maxclients 10000

# حداکثر مقدار حافظه قابل استفاده توسط Redis
maxmemory 2gb

# سیاست حذف کلیدها زمانی که حداکثر حافظه استفاده شده است
# volatile-lru: حذف کلیدهایی که LRU (Least Recently Used) هستند و timeout دارند.
# allkeys-lru: حذف کلیدهایی که LRU هستند (بدون در نظر گرفتن timeout).
# volatile-ttl: حذف کلیدهایی که نزدیکترین expiry را دارند.
# noeviction: در صورت پر شدن حافظه، خطایی برمی‌گرداند.
maxmemory-policy allkeys-lru

# =================================== ADVANCED ====================================

# فعال کردن lazy free برای کاهش تاخیر هنگام حذف کلیدها (اختیاری)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# فعال کردن TCP keepalive برای جلوگیری از قطع شدن اتصالات idle
tcp-keepalive 300

# ================================ CLUSTER CONFIGURATION ===========================
# اگر از Redis Cluster استفاده می‌کنید، تنظیمات مربوطه را در اینجا اضافه کنید.
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 5000